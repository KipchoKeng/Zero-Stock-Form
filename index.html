<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มประเมินการสำรองยาและนโยบาย Zero-Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 bg-white">
                    <h3 class="text-center mb-4 text-primary">แบบฟอร์มประเมินการสำรองยาและนโยบาย Zero-Stock<br><small class="text-muted fs-6">รพ.สต. เครือข่ายโรงพยาบาลสวี</small></h3>
                    
                    <form id="zeroStockForm">
                        <!-- วันที่ประเมิน -->
                        <div class="mb-3">
                            <label class="form-label">วันที่ประเมิน / บันทึกข้อมูล *</label>
                            <input type="date" class="form-control" id="evalDate" required>
                        </div>

                        <!-- เลือก รพ.สต. 16 แห่ง -->
                        <div class="mb-3">
                            <label class="form-label">ชื่อ รพ.สต. *</label>
                            <select class="form-select" id="hospitalName" required>
                                <option value="" selected disabled>-- เลือก รพ.สต. --</option>
                                <option value="รพ.สต.สวี">1. รพ.สต.สวี</option>
                                <option value="รพ.สต.ทุ่งระยะ">2. รพ.สต.ทุ่งระยะ</option>
                                <option value="รพ.สต.ทุ่งระยะ บ้านคลองน้อย">3. รพ.สต.ทุ่งระยะ บ้านคลองน้อย</option>
                                <option value="รพ.สต.ท่าหิน">4. รพ.สต.ท่าหิน</option>
                                <option value="รพ.สต.ปากแพรก">5. รพ.สต.ปากแพรก</option>
                                <option value="รพ.สต.ด่านสวี">6. รพ.สต.ด่านสวี</option>
                                <option value="รพ.สต.ครน">7. รพ.สต.ครน</option>
                                <option value="รพ.สต.บ้านน้ำฉา">8. รพ.สต.บ้านน้ำฉา</option>
                                <option value="รพ.สต.บ้านควนสามัคคี">9. รพ.สต.บ้านควนสามัคคี</option>
                                <option value="รพ.สต.วิสัยใต้">10. รพ.สต.วิสัยใต้</option>
                                <option value="รพ.สต.บ้านดอนทราย">11. รพ.สต.บ้านดอนทราย</option>
                                <option value="รพ.สต.นาสัก">12. รพ.สต.นาสัก</option>
                                <option value="รพ.สต.บ้านแก่งกระทั่ง">13. รพ.สต.บ้านแก่งกระทั่ง</option>
                                <option value="รพ.สต.บ้านไทยพัฒนา">14. รพ.สต.บ้านไทยพัฒนา</option>
                                <option value="รพ.สต.เขาทะลุ">15. รพ.สต.เขาทะลุ</option>
                                <option value="รพ.สต.เขาค่าย">16. รพ.สต.เขาค่าย</option>
                            </select>
                        </div>

                        <!-- ผู้ให้ข้อมูล -->
                        <div class="mb-3">
                            <label class="form-label">ชื่อ-นามสกุล ผู้ให้ข้อมูล / ผู้รับประเมิน *</label>
                            <input type="text" class="form-control" id="evaluator" placeholder="ระบุชื่อ-นามสกุล" required>
                        </div>

                        <!-- เบอร์โทร -->
                        <div class="mb-3">
                            <label class="form-label">หมายเลขโทรศัพท์ / Line ID *</label>
                            <input type="text" class="form-control" id="phone" placeholder="ระบุเบอร์โทรศัพท์ หรือ Line ID" required>
                        </div>

                        <!-- การใช้งานระบบเบิกผ่านเว็บไซต์ -->
                        <div class="mb-3">
                            <label class="form-label">
                                การใช้งานระบบเบิกผ่านเว็บไซต์ 
                                <a href="https://sawee-vmi.vercel.app/" target="_blank" class="text-decoration-none">(https://sawee-vmi.vercel.app/)</a> 
                                และการตัดรอบ (วันที่ 21 ถึง 20 ของเดือน) *
                            </label>
                            <select class="form-select" id="systemUsage" required>
                                <option value="" selected disabled>-- เลือกผลการประเมิน --</option>
                                <option value="ดำเนินการตามรอบและบันทึกข้อมูลถูกต้องครบถ้วน">1. ดำเนินการตามรอบและบันทึกข้อมูลถูกต้องครบถ้วน</option>
                                <option value="มีการปรับจำนวนยาที่เบิกพร้อมระบุเหตุผล (กรณีคาดการณ์)">2. มีการปรับจำนวนยาที่เบิกพร้อมระบุเหตุผล (กรณีคาดการณ์)</option>
                                <option value="ยังไม่เป็นไปตามกำหนดรอบการเบิก">3. ยังไม่เป็นไปตามกำหนดรอบการเบิก</option>
                            </select>
                        </div>

                        <!-- การปรับคลัง JHCIS -->
                        <div class="mb-3">
                            <label class="form-label">การปรับคลัง รพ.สต.ให้เป็นคลังเป็นเดียวน ในระบบ JHCIS *</label>
                            <select class="form-select" id="jhcisStock" required>
                                <option value="" selected disabled>-- เลือกสถานะการปรับคลัง --</option>
                                <option value="รพ.สต. มีการรวมคลังย่อยทั้งหมดให้เป็นคลังเดียวในระบบ JHCIS แล้ว (Single Stock)">รพ.สต. มีการรวมคลังย่อยทั้งหมดให้เป็นคลังเดียวในระบบ JHCIS แล้ว (Single Stock)</option>
                                <option value="ยังไม่ได้รวมคลังยาให้เป็นคลังเดียว">ยังไม่ได้รวมคลังยาให้เป็นคลังเดียว</option>
                            </select>
                        </div>

                        <!-- การคืนยาเพื่อปรับ รายการยาตั้งต้น -->
                        <div class="mb-3">
                            <label class="form-label">การคืนยาเพื่อปรับ รายการยาตั้งต้น *</label>
                            <select class="form-select" id="returnDrug" required>
                                <option value="" selected disabled>-- เลือกสถานะการคืนยา --</option>
                                <option value="มีการตรวจสอบและประสานงานคืนเรียบร้อย">มีการตรวจสอบและประสานงานคืนเรียบร้อย</option>
                                <option value="ยังไม่ได้ดำเนินการ">ยังไม่ได้ดำเนินการ</option>
                            </select>
                        </div>

                        <!-- ข้อเสนอแนะ -->
                        <div class="mb-3">
                            <label class="form-label">ข้อเสนอแนะเพิ่มเติมหรือปัญหาอุปสรรคในการดำเนินงาน</label>
                            <textarea class="form-control" id="suggestion" rows="2" placeholder="ระบุข้อเสนอแนะหรือปัญหาอุปสรรค (ถ้ามี)"></textarea>
                        </div>

                        <!-- รายการยาสารธารณะ -->
                        <div class="mb-3">
                            <label class="form-label">รายการยาสารธารณะ ของ รพ.สต. *</label>
                            <textarea class="form-control" id="drugList" rows="3" placeholder="ระบุรายการยา..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">บันทึกข้อมูล</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHZuShM_JTf325EWXU2Vbr7MlF2HPRyD_GnlsEqEP96cKOmJ_obU77K4TKDzz6uVNp8A/exec"; // แทนที่ด้วย URL ของ Google Apps Script

        document.getElementById('zeroStockForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            const formData = {
                evalDate: document.getElementById('evalDate').value,
                hospitalName: document.getElementById('hospitalName').value,
                evaluator: document.getElementById('evaluator').value,
                phone: document.getElementById('phone').value,
                systemUsage: document.getElementById('systemUsage').value,
                jhcisStock: document.getElementById('jhcisStock').value,
                returnDrug: document.getElementById('returnDrug').value,
                suggestion: document.getElementById('suggestion').value,
                drugList: document.getElementById('drugList').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            }).then(() => {
                alert('บันทึกข้อมูลสำเร็จ!');
                document.getElementById('zeroStockForm').reset();
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูล';
            }).catch(error => {
                alert('เกิดข้อผิดพลาด: ' + error);
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูล';
            });
        });
    </script>
</body>
</html>
