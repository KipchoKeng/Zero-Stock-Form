<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบเยี่ยมสำรวจ Zero Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 bg-white">
                    <h3 class="text-center mb-4 text-primary">แบบเยี่ยมสำรวจ Zero Stock</h3>
                    <form id="zeroStockForm">
                        <div class="mb-3">
                            <label class="form-label">วันที่ประเมิน / บันทึกข้อมูล</label>
                            <input type="date" class="form-control" id="evalDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ชื่อ รพ.สต.</label>
                            <input type="text" class="form-control" id="hospitalName" placeholder="ระบุชื่อ รพ.สต." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ชื่อ-นามสกุล ผู้ให้ข้อมูล / ผู้รับประเมิน</label>
                            <input type="text" class="form-control" id="evaluator" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">หมายเลขโทรศัพท์ / Line ID</label>
                            <input type="text" class="form-control" id="phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">การใช้งานระบบเบิกผ่านเว็บไซต์</label>
                            <input type="text" class="form-control" id="systemUsage" value="ดำเนินการตามรอบและบันทึกข้อมูลถูกต้องครบถ้วน" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">รายการยาสารธารณะ ของ รพ.สต.</label>
                            <textarea class="form-control" id="drugList" rows="3" placeholder="ระบุรายการยา..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">บันทึกข้อมูล</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8z6EL062Zsv92L1pgI_ln-VQIJUnpJoisBTwJZbr8yat69nJXZJSO-xBGw1SgRGzZmg/exec"; 

        document.getElementById('zeroStockForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            const formData = {
                evalDate: document.getElementById('evalDate').value,
                hospitalName: document.getElementById('hospitalName').value,
                evaluator: document.getElementById('evaluator').value,
                phone: document.getElementById('phone').value,
                systemUsage: document.getElementById('systemUsage').value,
                drugList: document.getElementById('drugList').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            }).then(() => {
                alert('บันทึกข้อมูลสำเร็จ!');
                document.getElementById('zeroStockForm').reset();
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูล';
            }).catch(error => {
                alert('เกิดข้อผิดพลาด: ' + error);
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูล';
            });
        });
    </script>
</body>
</html>
